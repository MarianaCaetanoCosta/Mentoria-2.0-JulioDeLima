      :root {
        --bg: #14100d;
        --sf: #1f1814;
        --sf2: #2a211b;
        --bd: #3a2d24;
        --tx: #f5ebe0;
        --mu: #a8978a;
        --or: #ff8a1f;
        --or2: #ffb066;
        --rd: #ff5a4d;
        --gr: #5fd38d;
        --ye: #ffd166;
        color-scheme: dark;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        background: var(--sf);
        z-index: 5;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 4;
        background: var(--sf);
        border-bottom: 1px solid var(--bd);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        flex-wrap: wrap;
      }
      .brand {
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--or);
      }
      nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        max-width: 100%;
      }
      nav button {
        background: transparent;
        color: var(--mu);
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        white-space: nowrap;
        cursor: pointer;
        font: inherit;
      }
      nav button:hover {
        background: var(--sf2);
        color: var(--tx);
      }
      nav button.on {
        background: var(--or);
        color: #1a0f05;
        font-weight: 600;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px 16px 60px;
      }
      h2 {
        margin: 0;
        font-size: 1.3rem;
        color: var(--or2);
      }
      h3 {
        margin: 22px 0 10px;
        color: var(--or2);
        font-size: 1.05rem;
      }
      .bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 14px;
      }
      .bar h2 {
        flex: 1 1 auto;
      }
      .bar input,
      .bar select {
        width: auto;
        flex: 1 1 150px;
        max-width: 260px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-top: 3px solid var(--or);
        border-radius: 12px;
        padding: 14px;
      }
      .card small {
        color: var(--mu);
      }
      .card b {
        display: block;
        font-size: 1.7rem;
        color: var(--or2);
      }
      .tw {
        overflow-x: auto;
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
      }
      th,
      td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--bd);
        vertical-align: middle;
      }
      th {
        color: var(--mu);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.act {
        white-space: nowrap;
        text-align: right;
      }
      td.empty {
        text-align: center;
        color: var(--mu);
        padding: 26px;
      }
      input,
      select,
      textarea {
        width: 100%;
        background: var(--sf2);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 9px 11px;
        font: inherit;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--or);
        border-color: transparent;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--mu);
        margin-top: 12px;
      }
      label input,
      label select,
      label textarea {
        margin-top: 4px;
        color: var(--tx);
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        background: var(--or);
        color: #1a0f05;
        font-weight: 600;
      }
      button:hover {

  <body>
    <header>
      <div class="brand">
        <i>🐾</i>
        <div class="bt">
          <b>PetQA</b><small>GESTÃO INTELIGENTE • PET SHOP</small>
        </div>
      </div>
      <nav id="nav">
        <button data-r="dash">Início</button
        ><button data-r="clients">Clientes</button
        ><button data-r="pets">Pets</button
        ><button data-r="appts">Agendamentos</button
        ><button data-r="hist">Histórico de Atendimentos</button>
      </nav>
    </header>
    <main id="app"></main>
    <div class="ov" id="ov">
      <form class="md" id="mf">
        <h3 id="mt"></h3>
        <div id="mb"></div>
      </form>
    </div>

    <script>
      const K = "petshop.v1";
      let db = { clients: [], pets: [], appts: [] };
      try {
        Object.assign(db, JSON.parse(localStorage.getItem(K)) || {});
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem(K, JSON.stringify(db));
        } catch (e) {}
      };
      const $ = (s) => document.querySelector(s);
      const uid = () =>
        Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const money = (v) =>
        Number(v || 0).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      const dt = (d) => (d ? d.split("-").reverse().join("/") : "");
      const p2 = (n) => String(n).padStart(2, "0");
      const today = () => {
        const d = new Date();
        return (
          d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate())
        );
      };
      const SERV = {
        Banho: 50,
        Tosa: 60,
        "Banho e Tosa": 100,
        "Corte de unhas": 25,
        "Limpeza de ouvidos": 30,
      };
      const ST = ["Agendado", "Em Atendimento", "Concluído", "Cancelado"];
      const client = (id) => db.clients.find((c) => c.id === id),
        pet = (id) => db.pets.find((p) => p.id === id),
        ap = (id) => db.appts.find((a) => a.id === id);
      const tutor = (p) => client(p.clientId)?.name || "—";
      const byDT = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);

      /* helpers de UI */
      const f = (l, n, v, t = "text", x = "", req = true) =>
        `<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${req ? "required" : ""} ${x}></label>`;
      const ta = (l, n, v) =>
        `<label>${l}<textarea name="${n}" rows="3">${esc(v)}</textarea></label>`;
      const sel = (l, n, o, v) =>
        `<label>${l}<select name="${n}" required>${o.map((x) => `<option value="${esc(x[0])}" ${x[0] === v ? "selected" : ""}>${esc(x[1])}</option>`).join("")}</select></label>`;
      const btn = (t, c, k = "") =>
        `<button type="button" class="ghost sm ${k}" onclick="${c}">${t}</button>`;
      const dog = (fur, ear, s = 80) =>
        `<svg viewBox="0 0 100 100" width="${s}" height="${s}" aria-hidden="true"><ellipse cx="22" cy="42" rx="14" ry="26" fill="${ear}" transform="rotate(18 22 42)"/><ellipse cx="78" cy="42" rx="14" ry="26" fill="${ear}" transform="rotate(-18 78 42)"/><circle cx="50" cy="55" r="33" fill="${fur}"/><ellipse cx="50" cy="68" rx="18" ry="14" fill="#fff"/><ellipse cx="50" cy="60" rx="7" ry="5" fill="#222"/><circle cx="38" cy="46" r="4" fill="#222"/><circle cx="62" cy="46" r="4" fill="#222"/><circle cx="39.3" cy="44.7" r="1.3" fill="#fff"/><circle cx="63.3" cy="44.7" r="1.3" fill="#fff"/><path d="M50 65v5M42 72q8 7 16 0" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M46 74q4 9 8 0z" fill="#ff7a8a"/></svg>`;
      const cat = (s, f = "#d9d3cb", e = "#c9c3bb") =>
        `<svg viewBox="0 0 100 100" width="${s}" height="${s}" aria-hidden="true"><polygon points="16,14 42,30 20,52" fill="${e}"/><polygon points="84,14 58,30 80,52" fill="${e}"/><circle cx="50" cy="58" r="33" fill="${f}"/><circle cx="38" cy="52" r="4" fill="#222"/><circle cx="62" cy="52" r="4" fill="#222"/><path d="M46 63h8l-4 5z" fill="#ff7a8a"/><path d="M50 68q-6 7-12 3M50 68q6 7 12 3M22 62l14 3M78 62l-14 3" stroke="#222" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
      const rnd = (a) => a[Math.floor(Math.random() * a.length)];
      const CATC = [
        ["#d9d3cb", "#c9c3bb"],
        ["#f0d9b5", "#d9a96a"],
        ["#6b6b6b", "#4a4a4a"],
        ["#f6f6f6", "#dcdcdc"],
        ["#b89a7a", "#8f735a"],
      ];
      const tile = (side, type) => {
        const z = side ? 88 : 108;
        let v;
        if (type === "dog") {
          const c = rnd(FUR);
          v = dog(c[0], c[1], z);
        } else {
          const c = rnd(CATC);
          v = cat(z, c[0], c[1]);
        }
        return `<div class="tile${side ? " side" : ""}">${v}</div>`;
      };
      const tiles = () => {
        const t = ["dog", "cat", Math.random() < 0.5 ? "dog" : "cat"].sort(
          () => Math.random() - 0.5,
        );
        return tile(1, t[0]) + tile(0, t[1]) + tile(1, t[2]);
      };
      const roll = () => {
        $(".dogs").innerHTML = tiles();
      };
      const FUR = [
        ["#e8a35c", "#b9722f"],
        ["#f1d9b5", "#c58b4a"],
        ["#8b6b4a", "#5a4130"],
        ["#dcdcdc", "#8f8f8f"],
      ];
      const avatar = (p) => {
        const c =
          FUR[[...p.name].reduce((s, ch) => s + ch.charCodeAt(0), 0) % 4];
        return `<span class="av">${p.species === "Cachorro" ? dog(c[0], c[1], 32) : p.species === "Gato" ? cat(32) : "🐾"}</span>`;
      };
      const empty = (n) =>
        `<tr><td colspan="${n}" class="empty">${dog("#c9b8a6", "#8a7765", 64)}Nenhum registro encontrado.</td></tr>`;
      const table = (h, id) =>
        `<div class="tw"><table><thead><tr>${h.map((x) => `<th>${x}</th>`).join("")}</tr></thead><tbody id="${id}"></tbody></table></div>`;

      function modal(title, body, onOk, okText = "Salvar") {
        $("#mt").textContent = title;
        $("#mb").innerHTML =
          body +
          '<div class="err" id="me"></div><div class="row"><button type="button" class="ghost" onclick="closeM()">Cancelar</button><button type="submit">' +
          okText +
          "</button></div>";
        $("#mf").onsubmit = (e) => {
          e.preventDefault();
          const r = onOk(new FormData($("#mf")));
          if (r) $("#me").textContent = r;
          else closeM();
        };
        $("#ov").classList.add("on");
      }
      const closeM = () => $("#ov").classList.remove("on");
      const ask = (msg, fn, ok = "Confirmar") =>
        modal(
          "Confirmação",
          `<p>${esc(msg)}</p>`,
          () => {
            fn();
          },
          ok,
        );
      const info = (msg) =>
        modal("Aviso", `<p>${esc(msg)}</p>`, () => {}, "OK");

      /* navegação */
      const views = {};
      let route = "dash";
      function go(r) {
        route = r;
        document
          .querySelectorAll("#nav button")
          .forEach((b) => b.classList.toggle("on", b.dataset.r === r));
        views[r]();
      }
      const render = () => go(route);
      $("#nav").onclick = (e) => {
        if (e.target.dataset.r) go(e.target.dataset.r);
      };

      /* agendamentos – linhas e ações */
      const acts = (a) =>
        a.status === "Agendado"
          ? btn("Iniciar", `setSt('${a.id}','Em Atendimento')`) +
            btn("Editar", `editAppt('${a.id}')`) +
            btn("Cancelar", `setSt('${a.id}','Cancelado')`, "del")
          : a.status === "Em Atendimento"
            ? btn("Concluir", `conclude('${a.id}')`) +
              btn("Cancelar", `setSt('${a.id}','Cancelado')`, "del")
            : "";
      const acts0 = acts;
      const acts2 = (a) =>
        acts0(a) + btn("Excluir", `delAppt('${a.id}')`, "del");
      const apptRow = (a) => {
        const p = pet(a.petId);
        return `<tr><td>${dt(a.date)}</td><td>${esc(a.time)}</td><td>${p ? avatar(p) : ""}${esc(p?.name)}</td><td>${esc(p ? tutor(p) : "")}</td><td>${esc(a.service)}</td><td>${money(a.status === "Concluído" ? a.charged : a.value)}</td><td><span class="b s${ST.indexOf(a.status)}">${a.status}</span></td><td class="act">${acts2(a)}</td></tr>`;
      };
      const APH = [
        "Data",
        "Hora",
        "Pet",
        "Tutor",
        "Serviço",
        "Valor",
        "Status",
        "",
      ];

      function delAppt(id) {
        ask(
          "Deseja realmente excluir este agendamento? Esta ação não pode ser desfeita.",
          () => {
            db.appts = db.appts.filter((a) => a.id !== id);
            save();
            render();
          },
          "Excluir",
        );
      }
      function setSt(id, s) {
        const a = ap(id);
        if (s === "Cancelado") {
          ask(
            "Deseja realmente cancelar este agendamento?",
            () => {
              a.status = s;
              save();
              render();
            },
            "Cancelar agendamento",
          );
          return;
        }
        if (a.status === "Cancelado") return;
        a.status = s;
        save();
        render();
      }
      function conclude(id) {
        const a = ap(id);
        if (a.status === "Cancelado")
          return info("Agendamento cancelado não pode ser concluído.");
        modal(
          "Concluir atendimento",
          `<p class="mu">${esc(a.service)} — ${esc(pet(a.petId)?.name)}</p>` +
            f(
              "Valor cobrado (R$)",
              "v",
              a.value,
              "number",
              'min="0" step="0.01"',
            ),
          (fd) => {
            const v = parseFloat(fd.get("v"));
            if (isNaN(v) || v < 0) return "Valor inválido.";
            a.status = "Concluído";
            a.charged = v;
            a.doneDate = today();
            save();
            render();
          },
          "Concluir",
        );
      }
      function editAppt(id) {
        if (!db.pets.length)
          return modal(
            "Aviso",
            "<p>Cadastre ao menos um pet antes de agendar um serviço.</p>",
            () => {
              go("pets");
            },
            "Cadastrar pet",
          );
        const a = id ? ap(id) : {};
        modal(
          id ? "Editar agendamento" : "Novo agendamento",
          sel(
            "Pet",
            "petId",
            db.pets.map((p) => [p.id, p.name + " — " + tutor(p)]),
            a.petId,
          ) +
            sel(
              "Serviço",
              "service",
              Object.keys(SERV).map((s) => [s, s]),
              a.service,
            ) +
            f("Data", "date", a.date, "date", `min="${today()}"`) +
            f("Horário", "time", a.time, "time") +
            f(
              "Valor (R$)",
              "value",
              a.value ?? SERV.Banho,
              "number",
              'min="0" step="0.01"',
            ),
          (fd) => {
            const o = Object.fromEntries(fd),
              v = parseFloat(o.value);
            if (isNaN(v) || v < 0) return "Valor inválido.";
            const ts = new Date(o.date + "T" + o.time);
            if (isNaN(ts) || ts <= new Date())
              return "O agendamento deve ser para uma data e horário futuros.";
            if (
              db.appts.some(
                (x) =>
                  x.id !== id &&
                  x.petId === o.petId &&
                  x.date === o.date &&
                  x.time === o.time &&
                  x.status !== "Cancelado",
              )
            )
              return "Este pet já possui agendamento nesta data e horário.";
            const d = {
              petId: o.petId,
              service: o.service,
              date: o.date,
              time: o.time,
              value: v,
            };
            if (id) Object.assign(a, d);
            else db.appts.push({ id: uid(), status: "Agendado", ...d });
            save();
            render();
          },
          id ? "Salvar" : "Cadastrar",
        );
        if (!id)
          $("#mf [name=service]").onchange = (e) => {
            $("#mf [name=value]").value = SERV[e.target.value];
          };
      }

      /* DASHBOARD */
      views.dash = () => {
        const t = today(),
          done = db.appts.filter((a) => a.status === "Concluído");
        $("#app").innerHTML =
          `<div class="hero"><div><h1>Bem-vindo ao <em>PetQA</em> 🐾</h1><p>Cuide dos clientes, dos pets e da agenda de banho e tosa em um só lugar.</p><button onclick="editAppt()">+ Novo agendamento</button></div><div class="dogs" onclick="roll()" title="Clique para trocar os bichinhos">${tiles()}</div></div>
  <div class="cards">
    <div class="card"><small>Clientes cadastrados</small><b>${db.clients.length}</b></div>
    <div class="card"><small>Pets cadastrados</small><b>${db.pets.length}</b></div>
    <div class="card"><small>Agendamentos do dia</small><b>${db.appts.filter((a) => a.date === t && a.status !== "Cancelado").length}</b></div>
    <div class="card"><small>Atendimentos concluídos</small><b>${done.length}</b></div>
    <div class="card"><small>Faturamento</small><b style="font-size:1.3rem">${money(done.reduce((s, a) => s + a.charged, 0))}</b></div>
  </div>
  <h3>Próximos agendamentos</h3>${table(APH, "tb")}`;
        const l = db.appts
          .filter(
            (a) => a.status === "Agendado" || a.status === "Em Atendimento",
          )
          .sort(byDT)
          .slice(0, 10);
        $("#tb").innerHTML = l.map(apptRow).join("") || empty(8);
      };

      /* CLIENTES */
      views.clients = () => {
        $("#app").innerHTML =
          `<div class="bar"><h2>Clientes</h2><input id="q" placeholder="Pesquisar pelo nome…" oninput="lc()"><button onclick="editClient()">+ Novo cliente</button></div>${table(["Nome", "Telefone", "E-mail", "Endereço", ""], "tb")}`;
        lc();
      };
      function lc() {
        const q = $("#q").value.toLowerCase();
        const l = db.clients
          .filter((c) => c.name.toLowerCase().includes(q))
          .sort((a, b) => a.name.localeCompare(b.name));
        $("#tb").innerHTML =
          l
            .map(
              (c) =>
                `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${esc(c.address)}</td><td class="act">${btn("Editar", `editClient('${c.id}')`)}${btn("Excluir", `delClient('${c.id}')`, "del")}</td></tr>`,
            )
            .join("") || empty(5);
      }
      function editClient(id) {
        const c = id ? client(id) : {};
        modal(
          id ? "Editar cliente" : "Novo cliente",
          f("Nome completo", "name", c.name) +
            f("Telefone", "phone", c.phone, "tel") +
            f("E-mail", "email", c.email, "email") +
            f("Endereço", "address", c.address),
          (fd) => {
            const o = Object.fromEntries(
              [...fd].map(([k, v]) => [k, v.trim()]),
            );
            if (Object.values(o).some((v) => !v))
              return "Preencha todos os campos.";
            if (o.phone.replace(/\D/g, "").length < 10)
              return "Telefone inválido (informe DDD + número).";
            if (id) Object.assign(c, o);
            else db.clients.push({ id: uid(), ...o });
            save();
            render();
          },
        );
      }
      function delClient(id) {
        const n = db.pets.filter((p) => p.clientId === id).length;
        if (n)
          return info(
            `Este cliente possui ${n} pet(s) cadastrado(s). Exclua ou transfira os pets para outro cliente antes de excluí-lo.`,
          );
        ask(
          "Deseja realmente excluir este cliente?",
          () => {
            db.clients = db.clients.filter((c) => c.id !== id);
            save();
            render();
          },
          "Excluir",
        );
      }

      /* PETS */
      views.pets = () => {
        $("#app").innerHTML =
          `<div class="bar"><h2>Pets</h2><input id="q" placeholder="Pesquisar pelo nome…" oninput="lp()"><button onclick="editPet()">Cadastrar</button></div>${table(["Nome", "Espécie", "Raça", "Idade", "Peso", "Pelo embolado", "Tutor", "Observações", ""], "tb")}`;
        lp();
      };
      function lp() {
        const q = $("#q").value.toLowerCase();
        const l = db.pets
          .filter((p) => p.name.toLowerCase().includes(q))
          .sort((a, b) => a.name.localeCompare(b.name));
        $("#tb").innerHTML =
          l
            .map(
              (p) =>
                `<tr><td>${avatar(p)}${esc(p.name)}</td><td>${esc(p.species)}</td><td>${esc(p.breed)}</td><td>${esc(p.age)} ${p.age == 1 ? "ano" : "anos"}</td><td>${p.weight ? esc(String(p.weight).replace(".", ",")) + " kg" : "—"}</td><td>${p.matted === "Sim" ? '<span class="b s1">Sim</span>' : p.matted === "Não" ? '<span class="b s2">Não</span>' : "—"}</td><td>${esc(tutor(p))}</td><td class="mu">${esc(p.notes)}</td><td class="act">${btn("Histórico", `hp='${p.id}';go('hist')`)}${btn("Editar", `editPet('${p.id}')`)}${btn("Excluir", `delPet('${p.id}')`, "del")}</td></tr>`,
            )
            .join("") || empty(9);
      }
      function editPet(id) {
        if (!db.clients.length)
          return modal(
            "Aviso",
            "<p>Cadastre ao menos um cliente (tutor) antes de cadastrar um pet.</p>",
            () => {
              go("clients");
            },
            "Cadastrar cliente",
          );
        const p = id ? pet(id) : {};
        modal(
          id ? "Editar pet" : "Cadastrar pet",
          f("Nome do pet", "name", p.name) +
            sel(
              "Tutor (cliente)",
              "clientId",
              db.clients.map((c) => [c.id, c.name]),
              p.clientId,
            ) +
            sel(
              "Espécie",
              "species",
              ["Cachorro", "Gato", "Outros"].map((s) => [s, s]),
              p.species,
            ) +
            f("Raça", "breed", p.breed) +
            f(
              "Idade (anos)",
              "age",
              p.age,
              "number",
              'min="0" max="40" step="0.1"',
            ) +
            f(
              "Peso (kg)",
              "weight",
              p.weight,
              "number",
              'min="0.1" max="120" step="0.1"',
            ) +
            sel(
              "Pelo embolado?",
              "matted",
              [
                ["Não", "Não"],
                ["Sim", "Sim"],
              ],
              p.matted || "Não",
            ) +
            ta("Observações importantes", "notes", p.notes),
          (fd) => {
            const o = Object.fromEntries(
              [...fd].map(([k, v]) => [k, v.trim()]),
            );
            if (!o.name || !o.breed)
              return "Preencha todos os campos obrigatórios.";
            if (!client(o.clientId))
              return "Selecione um cliente existente como tutor.";
            const w = parseFloat(o.weight);
            if (isNaN(w) || w <= 0) return "Informe um peso válido.";
            o.weight = w;
            o.size = w <= 10 ? "Pequeno" : w <= 25 ? "Médio" : "Grande";
            if (id) Object.assign(p, o);
            else db.pets.push({ id: uid(), ...o });
            save();
            render();
          },
          id ? "Salvar" : "Cadastrar",
        );
      }
      function delPet(id) {
        const n = db.appts.filter((a) => a.petId === id).length;
        ask(
          "Deseja realmente excluir este pet?" +
            (n
              ? ` Seus ${n} agendamento(s)/atendimento(s) também serão removidos.`
              : ""),
          () => {
            db.pets = db.pets.filter((p) => p.id !== id);
            db.appts = db.appts.filter((a) => a.petId !== id);
            save();
            render();
          },
          "Excluir",
        );
      }

      /* AGENDAMENTOS */
      views.appts = () => {
        $("#app").innerHTML =
          `<div class="bar"><h2>Agendamentos</h2><button onclick="editAppt()">+ Novo agendamento</button></div>
  <div class="bar"><input id="fd" type="date" onchange="la()" title="Data"><select id="fs" onchange="la()"><option value="">Todos os serviços</option>${Object.keys(
    SERV,
  )
    .map((s) => `<option>${s}</option>`)
    .join(
      "",
    )}</select><select id="ft" onchange="la()"><option value="">Todos os status</option>${ST.map((s) => `<option>${s}</option>`).join("")}</select><button class="ghost" onclick="$('#fd').value=$('#fs').value=$('#ft').value='';la()">Limpar filtros</button></div>${table(APH, "tb")}`;
        la();
      };
      function la() {
        const d = $("#fd").value,
          s = $("#fs").value,
          t = $("#ft").value;
        const l = db.appts
          .filter(
            (a) =>
              (!d || a.date === d) &&
              (!s || a.service === s) &&
              (!t || a.status === t),
          )
          .sort(byDT);
        $("#tb").innerHTML = l.map(apptRow).join("") || empty(8);
      }

      /* HISTÓRICO */
      let hp = "";
      views.hist = () => {
        $("#app").innerHTML =
          `<div class="bar"><h2>Histórico de Atendimentos</h2><select id="hs" onchange="hp=this.value;lh()"><option value="">Todos os pets</option>${db.pets.map((p) => `<option value="${p.id}" ${p.id === hp ? "selected" : ""}>${esc(p.name)} — ${esc(tutor(p))}</option>`).join("")}</select></div>${table(["Data", "Pet", "Tutor", "Serviço realizado", "Valor cobrado"], "tb")}<div class="tot" id="tot"></div>`;
        lh();
      };
      function lh() {
        const l = db.appts
          .filter((a) => a.status === "Concluído" && (!hp || a.petId === hp))
          .sort((a, b) =>
            (b.doneDate + b.time).localeCompare(a.doneDate + a.time),
          );
        $("#tb").innerHTML =
          l
            .map((a) => {
              const p = pet(a.petId);
              return `<tr><td>${dt(a.doneDate)}</td><td>${esc(p?.name)}</td><td>${esc(p ? tutor(p) : "")}</td><td>${esc(a.service)}</td><td>${money(a.charged)}</td></tr>`;
            })
            .join("") || empty(5);
        $("#tot").innerHTML =
          `${l.length} atendimento(s) — Total: <b>${money(l.reduce((s, a) => s + a.charged, 0))}</b>`;
      }

      document.body.insertAdjacentHTML(
        "beforeend",
        '<div class="deco">' +
          dog("#f1d9b5", "#c58b4a", 150) +
          dog("#dcdcdc", "#8f8f8f", 150) +
          "</div>",
      );
      go("dash");
    </script>
  </body>
</html>
